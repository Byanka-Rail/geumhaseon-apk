name: Publish PWA (iOS 홈 화면용)

on:
  push:
    branches: [main]
    paths:
      - '사격임무_금하선_RTS_v*.html'
      - 'pwa/**'
      - '.github/workflows/pages-pwa.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: geumhaseon-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build site from latest game file
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, shutil, hashlib
          rx = re.compile(r"^사격임무_금하선_RTS_v(\d+)\.(\d+)(?:[._](\d+))?(?:[_-].*)?\.html$", re.I)
          found = []
          for p in Path('.').glob('사격임무_금하선_RTS_v*.html'):
              m = rx.match(p.name)
              if m: found.append(((int(m.group(1)), int(m.group(2)), int(m.group(3) or 0)), p))
          ver, game = max(found, key=lambda x: x[0])
          out = Path('_site'); out.mkdir(exist_ok=True)
          html = game.read_text(encoding='utf-8')
          inj = Path('pwa/sw-register.html').read_text(encoding='utf-8')
          html = html + '\n' + inj   # 맨 끝에 붙인다 — 글 속 '</body>' 문자열에 끼어들지 않게
          (out/'index.html').write_text(html, encoding='utf-8')
          for f in ['manifest.webmanifest','icon-180.png','icon-192.png','icon-512.png','icon.svg']:
              shutil.copy(Path('pwa')/f, out/f)
          build = hashlib.sha256(html.encode('utf-8')).hexdigest()[:12]
          sw = Path('pwa/sw.js').read_text(encoding='utf-8').replace('__BUILD__', build)
          (out/'sw.js').write_text(sw, encoding='utf-8')
          (out/'.nojekyll').write_text('')
          print('game =', game.name, 'build =', build)
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
