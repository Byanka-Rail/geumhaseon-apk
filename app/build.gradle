plugins {
    id 'com.android.application'
}

android {
    namespace 'com.byankarail.geumhaseon'
    compileSdk 35

    defaultConfig {
        applicationId 'com.byankarail.geumhaseon'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.0.1'
    }

    // 개인 설치용 고정 서명 키 — 빌드할 때마다 키가 바뀌면 덮어쓰기 설치가 막힌다.
    // Play Store 배포용 키로 쓰지 말 것.
    signingConfigs {
        sideload {
            storeFile file('geumhaseon-sideload.keystore')
            storePassword 'geumhaseon'
            keyAlias 'geumhaseon'
            keyPassword 'geumhaseon'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.sideload
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
